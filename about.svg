<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O mnie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/><stop offset="1" stop-color="#170d2e"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#b79cf5"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="270" rx="28"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}
      .o1{animation:f1 10s ease-in-out infinite alternate}
      .o2{animation:f2 12s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(60px,30px)}}
      @keyframes f2{to{transform:translate(-60px,-20px)}}
    </style>
  </defs>

  <rect width="900" height="270" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g filter="url(#blur)">
      <circle class="o1" cx="90" cy="250" r="100" fill="#6d28d9"/>
      <circle class="o2" cx="800" cy="30" r="110" fill="#9333ea" fill-opacity=".8"/>
    </g>
  </g>

  <rect x="30" y="25" width="840" height="220" rx="28" fill="url(#fill)"/>
  <rect x="30" y="25" width="840" height="90" rx="28" fill="url(#spec)"/>
  <rect x="30.6" y="25.6" width="838.8" height="218.8" rx="27.4" stroke="url(#rim)" stroke-width="1.2"/>

  <text class="s" x="66" y="68" font-size="12" font-weight="600" letter-spacing="5" fill="#a78bfa">O MNIE</text>
  <text class="s" x="64" y="104" font-size="26" font-weight="700" fill="#fff">Dopiero zaczynam.</text>

  <g class="s" font-size="14.5" fill="#cdbff0">
    <text x="66" y="140">Wchodzę w świat analizy danych. Uczę się SQL-a,</text>
    <text x="66" y="164">Pythona i Power BI, a to, czego się nauczę, od razu</text>
    <text x="66" y="188">ćwiczę na własnych projektach i otwartych zbiorach</text>
    <text x="66" y="212">danych. Szukam pierwszej pracy lub stażu.</text>
  </g>

  <!-- status tiles -->
  <g class="s" text-anchor="middle">
    <rect x="510" y="70" width="104" height="140" rx="22" fill="#fff" fill-opacity=".06"/>
    <rect x="510.5" y="70.5" width="103" height="139" rx="21.5" stroke="url(#rim)"/>
    <text x="562" y="104" font-size="10" font-weight="600" letter-spacing="3" fill="#a78bfa">TERAZ</text>
    <text x="562" y="148" font-size="26" font-weight="700" fill="url(#num)">SQL</text>
    <text x="562" y="174" font-size="12" fill="#b9a5e6">+ Python</text>

    <rect x="628" y="70" width="104" height="140" rx="22" fill="#fff" fill-opacity=".06"/>
    <rect x="628.5" y="70.5" width="103" height="139" rx="21.5" stroke="url(#rim)"/>
    <text x="680" y="104" font-size="10" font-weight="600" letter-spacing="3" fill="#a78bfa">NASTĘPNIE</text>
    <text x="680" y="148" font-size="21" font-weight="700" fill="url(#num)">Power BI</text>
    <text x="680" y="174" font-size="12" fill="#b9a5e6">dashboardy</text>

    <rect x="746" y="70" width="104" height="140" rx="22" fill="#a855f7" fill-opacity=".16"/>
    <rect x="746.5" y="70.5" width="103" height="139" rx="21.5" stroke="url(#rim)"/>
    <text x="798" y="104" font-size="10" font-weight="600" letter-spacing="3" fill="#d8b4fe">CEL</text>
    <text x="798" y="148" font-size="19" font-weight="700" fill="url(#num)">Junior DA</text>
    <text x="798" y="174" font-size="12" fill="#cdbff0">pierwsza praca</text>
  </g>
</svg>
