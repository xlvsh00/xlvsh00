<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kontakt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/><stop offset="1" stop-color="#160c2d"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="230" rx="28"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}
      .o1{animation:f1 10s ease-in-out infinite alternate}
      .o2{animation:f2 12s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(90px,-20px)}}
      @keyframes f2{to{transform:translate(-100px,20px)}}
    </style>
  </defs>

  <rect width="900" height="230" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g filter="url(#blur)">
      <circle class="o1" cx="120" cy="230" r="100" fill="#7c3aed" fill-opacity=".9"/>
      <circle class="o2" cx="790" cy="10" r="110" fill="#a855f7" fill-opacity=".8"/>
    </g>
  </g>

  <rect x="30" y="25" width="840" height="180" rx="28" fill="url(#fill)"/>
  <rect x="30" y="25" width="840" height="80" rx="28" fill="url(#spec)"/>
  <rect x="30.6" y="25.6" width="838.8" height="178.8" rx="27.4" stroke="url(#rim)" stroke-width="1.2"/>

  <g class="s">
    <text x="450" y="78" font-size="28" font-weight="700" fill="url(#txt)" text-anchor="middle">Porozmawiajmy o danych</text>
    <text x="450" y="104" font-size="14" fill="#c4b3ec" text-anchor="middle">Szukam pierwszej pracy lub stażu w analizie danych. Napisz do mnie.</text>

    <g font-size="14" font-weight="600" fill="#f1e9ff">
      <rect x="64" y="132" width="180" height="46" rx="23" fill="#fff" fill-opacity=".08" stroke="url(#rim)"/>
      <text x="154" y="160" text-anchor="middle">LinkedIn</text>

      <rect x="262" y="132" width="180" height="46" rx="23" fill="#fff" fill-opacity=".08" stroke="url(#rim)"/>
      <text x="352" y="160" text-anchor="middle">GitHub</text>

      <rect x="460" y="132" width="180" height="46" rx="23" fill="#fff" fill-opacity=".08" stroke="url(#rim)"/>
      <text x="550" y="160" text-anchor="middle">E-mail</text>

      <rect x="658" y="132" width="180" height="46" rx="23" fill="#a855f7" fill-opacity=".22" stroke="url(#rim)"/>
      <text x="748" y="160" text-anchor="middle">Projekty</text>
    </g>
  </g>
</svg>
