<svg width="290" height="260" viewBox="0 0 290 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projekt: eksploracja danych w Pythonie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="290" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/><stop offset="1" stop-color="#150b2b"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a855f7" stop-opacity=".35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="290" height="260" rx="26"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}
      .o1{animation:f1 9s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(-50px,-30px)}}
      .draw{stroke-dasharray:1;animation:d 2.2s .2s ease backwards}
      @keyframes d{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    </style>
  </defs>

  <rect width="290" height="260" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g filter="url(#blur)"><circle class="o1" cx="250" cy="230" r="70" fill="#7c3aed"/><circle cx="20" cy="10" r="60" fill="#a855f7" fill-opacity=".6"/></g>
  </g>

  <rect x="6" y="6" width="278" height="248" rx="22" fill="url(#fill)"/>
  <rect x="6" y="6" width="278" height="100" rx="22" fill="url(#spec)"/>
  <rect x="6.5" y="6.5" width="277" height="247" rx="21.5" stroke="url(#rim)"/>

  <g class="s">
    <rect x="26" y="26" width="140" height="22" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/>
    <text x="96" y="41" font-size="10.5" font-weight="600" fill="#d8c8fb" text-anchor="middle">Python · pandas</text>

    <text x="26" y="80" font-size="19" font-weight="700" fill="#fff">Eksploracja danych</text>
    <text x="26" y="103" font-size="19" font-weight="700" fill="#fff">(EDA) w Pythonie</text>
    <text x="26" y="128" font-size="12" fill="#b9a5e6">Czyszczenie zbioru i pierwsze wnioski</text>
    <text x="26" y="145" font-size="12" fill="#b9a5e6">w notebooku Jupyter, krok po kroku.</text>
  </g>

  <!-- ROC-like curve -->
  <g>
    <line x1="26" y1="226" x2="262" y2="166" stroke="#fff" stroke-opacity=".15" stroke-dasharray="3 4"/>
    <path d="M26 226 C40 190 56 178 90 172 S170 166 262 166 L262 226 Z" fill="url(#ar)"/>
    <path class="draw" pathLength="1" d="M26 226 C40 190 56 178 90 172 S170 166 262 166" stroke="url(#ln)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="262" cy="166" r="7" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="262" cy="166" r="3.5" fill="#fff"/>
  </g>
</svg>
