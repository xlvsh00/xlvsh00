<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="xlvsh00 — Junior Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#140b28"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a855f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="320" rx="28"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}
      .o1{animation:f1 9s ease-in-out infinite alternate}
      .o2{animation:f2 11s ease-in-out infinite alternate}
      .o3{animation:f1 13s ease-in-out infinite alternate-reverse}
      @keyframes f1{to{transform:translate(70px,40px)}}
      @keyframes f2{to{transform:translate(-80px,-30px)}}
      .draw{stroke-dasharray:1;animation:d 2.8s .3s ease backwards}
      .fade{animation:fi 1.2s 2.2s ease backwards}
      @keyframes d{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
      @keyframes fi{from{opacity:0}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s 3s ease-in-out infinite}
      @keyframes p{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.8);opacity:.15}}
    </style>
  </defs>

  <rect width="900" height="320" rx="28" fill="url(#bg)"/>

  <g clip-path="url(#c)">
    <g filter="url(#blur)">
      <circle class="o1" cx="130" cy="50" r="115" fill="#7c3aed"/>
      <circle class="o2" cx="780" cy="280" r="135" fill="#a855f7" fill-opacity=".85"/>
      <circle class="o3" cx="440" cy="340" r="90" fill="#4c1d95"/>
    </g>
  </g>

  <!-- glass panel -->
  <rect x="30" y="30" width="840" height="260" rx="30" fill="url(#fill)"/>
  <rect x="30" y="30" width="840" height="110" rx="30" fill="url(#spec)"/>
  <rect x="30.6" y="30.6" width="838.8" height="258.8" rx="29.4" stroke="url(#rim)" stroke-width="1.2"/>

  <!-- text -->
  <text class="s" x="70" y="104" font-size="13" font-weight="600" letter-spacing="5" fill="#a78bfa">JUNIOR DATA ANALYST</text>
  <text class="s" x="68" y="160" font-size="48" font-weight="700" fill="url(#txt)">xlvsh00</text>
  <text class="s" x="70" y="196" font-size="17" fill="#cbb8f5">Uczę się czytać dane. Krok po kroku.</text>

  <g class="s" font-size="13" font-weight="600" fill="#e9defc" text-anchor="middle">
    <rect x="70" y="228" width="64" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".22"/>
    <text x="102" y="249">SQL</text>
    <rect x="144" y="228" width="88" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".22"/>
    <text x="188" y="249">Python</text>
    <rect x="242" y="228" width="100" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".22"/>
    <text x="292" y="249">Power BI</text>
  </g>

  <!-- chart -->
  <g>
    <g stroke="#ffffff" stroke-opacity=".07">
      <line x1="530" y1="110" x2="840" y2="110"/>
      <line x1="530" y1="150" x2="840" y2="150"/>
      <line x1="530" y1="190" x2="840" y2="190"/>
      <line x1="530" y1="230" x2="840" y2="230"/>
    </g>
    <path class="fade" d="M530 220 C560 210 570 200 590 200 S625 218 640 215 S675 160 700 150 S735 168 750 165 S785 115 800 105 S825 90 840 85 L840 250 L530 250 Z" fill="url(#area)"/>
    <path class="draw" pathLength="1" d="M530 220 C560 210 570 200 590 200 S625 218 640 215 S675 160 700 150 S735 168 750 165 S785 115 800 105 S825 90 840 85" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <g class="fade">
      <circle cx="700" cy="150" r="4" fill="#e9d5ff"/>
      <circle cx="800" cy="105" r="4" fill="#e9d5ff"/>
      <circle cx="840" cy="85" r="9" fill="#a855f7" filter="url(#glow)"/>
      <circle cx="840" cy="85" r="4.5" fill="#fff"/>
      <circle class="pulse" cx="840" cy="85" r="7" fill="#c084fc"/>
    </g>
    <g class="s" font-size="10.5" fill="#a78bfa" fill-opacity=".7" text-anchor="middle">
      <text x="545" y="270">Excel</text>
      <text x="625" y="270">SQL</text>
      <text x="705" y="270">Python</text>
      <text x="785" y="270">BI</text>
    </g>
  </g>

  <!-- KPI pill -->
  <rect x="530" y="58" width="132" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="url(#rim)"/>
  <path d="M552 79 L558 68 L564 79 Z" fill="#c4b5fd"/>
  <text class="s" x="572" y="80" font-size="14" font-weight="700" fill="#fff">postęp</text>
  <text class="s" x="620" y="80" font-size="11" fill="#b9a5e6">2026</text>
</svg>
