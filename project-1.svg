<svg width="290" height="260" viewBox="0 0 290 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projekt: dashboard sprzedaży">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="290" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/><stop offset="1" stop-color="#150b2b"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="32"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d8b4fe"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="c"><rect width="290" height="260" rx="26"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}
      .o1{animation:f1 8s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(50px,-30px)}}
      .r{transform-box:fill-box;transform-origin:bottom center;animation:g .9s ease-out backwards}
      @keyframes g{from{transform:scaleY(0)}}
    </style>
  </defs>

  <rect width="290" height="260" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g filter="url(#blur)"><circle class="o1" cx="40" cy="230" r="70" fill="#7c3aed"/><circle cx="270" cy="20" r="60" fill="#a855f7" fill-opacity=".6"/></g>
  </g>

  <rect x="6" y="6" width="278" height="248" rx="22" fill="url(#fill)"/>
  <rect x="6" y="6" width="278" height="100" rx="22" fill="url(#spec)"/>
  <rect x="6.5" y="6.5" width="277" height="247" rx="21.5" stroke="url(#rim)"/>

  <g class="s">
    <rect x="26" y="26" width="116" height="22" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/>
    <text x="84" y="41" font-size="10.5" font-weight="600" fill="#d8c8fb" text-anchor="middle">SQL · Power BI</text>

    <text x="26" y="80" font-size="19" font-weight="700" fill="#fff">Pierwszy dashboard</text>
    <text x="26" y="103" font-size="19" font-weight="700" fill="#fff">sprzedaży sklepu</text>
    <text x="26" y="128" font-size="12" fill="#b9a5e6">Sprzedaż, kategorie produktów i</text>
    <text x="26" y="145" font-size="12" fill="#b9a5e6">trendy miesięczne w jednym raporcie.</text>
  </g>

  <g>
    <rect class="r" style="animation-delay:.1s" x="26" y="196" width="20" height="30" rx="5" fill="url(#col)" fill-opacity=".55"/>
    <rect class="r" style="animation-delay:.2s" x="56" y="186" width="20" height="40" rx="5" fill="url(#col)" fill-opacity=".6"/>
    <rect class="r" style="animation-delay:.3s" x="86" y="200" width="20" height="26" rx="5" fill="url(#col)" fill-opacity=".6"/>
    <rect class="r" style="animation-delay:.4s" x="116" y="176" width="20" height="50" rx="5" fill="url(#col)" fill-opacity=".75"/>
    <rect class="r" style="animation-delay:.5s" x="146" y="166" width="20" height="60" rx="5" fill="url(#col)" fill-opacity=".85"/>
    <rect class="r" style="animation-delay:.6s" x="176" y="180" width="20" height="46" rx="5" fill="url(#col)" fill-opacity=".85"/>
    <rect class="r" style="animation-delay:.7s" x="206" y="160" width="20" height="66" rx="5" fill="url(#col)"/>
    <rect class="r" style="animation-delay:.8s" x="236" y="170" width="20" height="56" rx="5" fill="url(#col)"/>
  </g>
</svg>
